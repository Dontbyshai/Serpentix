{# _dpad.html — Croix directionnelle pour écrans tactiles (incluse dans solo et partie).
   data-dir = vecteur "dx,dy" lu par controles.js. Masquée sur ordinateur (CSS). #}
<div class="dpad" aria-label="Flèches de direction">
  <button type="button" class="dpad-up" data-dir="0,-1" aria-label="Haut">▲</button>
  <button type="button" class="dpad-left" data-dir="-1,0" aria-label="Gauche">◀</button>
  <button type="button" class="dpad-right" data-dir="1,0" aria-label="Droite">▶</button>
  <button type="button" class="dpad-down" data-dir="0,1" aria-label="Bas">▼</button>
</div>
